name: Bug report
description: Report reproducible incorrect behaviour in AgentGuard.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Give a concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that consistently causes the problem.
      placeholder: |
        1. Start...
        2. Open...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Add relevant screenshots or sanitized logs. Remove secrets and personal data.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, browser, runtime, version, or commit when relevant.
      placeholder: OS, browser, Python or Node version, and commit SHA
    validations:
      required: true
