name: Feature or development task
description: Propose a defined implementation task for AgentGuard.
title: "[Task]: "
labels:
  - enhancement
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be implemented?
      placeholder: Describe the goal and the user or system need.
    validations:
      required: true

  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      description: Which development area owns this task?
      options:
        - Frontend
        - Backend
        - AI/ML & Security
        - DevOps & Infrastructure
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the requirements that must be completed.
      placeholder: |
        - [ ] Requirement one
        - [ ] Requirement two
    validations:
      required: true

  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes
      description: Add relevant implementation details or documentation links.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List issues that must be completed first, or write "None."
      placeholder: Depends on #123
